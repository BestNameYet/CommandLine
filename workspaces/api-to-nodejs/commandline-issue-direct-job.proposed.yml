# Proposed additions to .github/workflows/commandline-issue.yml
# Existing command job should additionally require:
# startsWith(github.event.comment.body, '<!-- github-command-surface:v1 -->')
# Add sibling job:
direct:
  if: github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '<!-- github-node-direct:v1 -->')
  uses: ./.github/workflows/direct-node-execution.yml
  permissions:
    contents: read
    issues: write

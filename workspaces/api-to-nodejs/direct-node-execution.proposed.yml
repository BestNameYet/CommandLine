name: Direct Node.js Execution
on:
  workflow_call:
jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and parse owner comment
        env:
          COMMAND_API_TOKEN: ${{ github.token }}
          COMMAND_ISSUE_NUMBER: ${{ vars.COMMAND_ISSUE_NUMBER }}
          DIRECT_PARSED_OUTPUT: ${{ runner.temp }}/direct-payload.json
        run: node src/direct-parser.js
      - name: Execute submitted JavaScript
        env:
          DIRECT_PARSED_OUTPUT: ${{ runner.temp }}/direct-payload.json
          DIRECT_RESULT_OUTPUT: ${{ runner.temp }}/direct-result.json
        run: node src/direct-runner.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-execution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/direct-payload.json
            ${{ runner.temp }}/direct-result.json
          if-no-files-found: warn
  publish:
    needs: execute
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: direct-execution-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Queue and render execution result
        env:
          COMMAND_API_TOKEN: ${{ github.token }}
          COMMAND_PARSED_OUTPUT: ${{ runner.temp }}/direct-payload.json
          COMMAND_SINGLE_RESULT: ${{ runner.temp }}/direct-result.json
          COMMAND_RESULT_QUEUE: ${{ runner.temp }}/result-queue.json
          COMMAND_OUTPUT_PATH: ${{ runner.temp }}/direct-output.txt
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          node src/publish-results.js append
          node -e "const fs=require('node:fs');const p=require('./src/publish-results.js');const x=JSON.parse(fs.readFileSync(process.env.COMMAND_PARSED_OUTPUT,'utf8'));p.main({...process.env,COMMAND_OUTPUT_DESTINATION:x.return.destination,COMMAND_OUTPUT_FORMAT:x.return.format}).catch(e=>{console.error(e);process.exitCode=1})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-output-${{ github.run_id }}
          path: ${{ runner.temp }}/direct-output.txt
          if-no-files-found: ignore

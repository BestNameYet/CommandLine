name: CommandLine Issue Terminal
on:
  issue_comment:
    types: [created, edited]
permissions:
  contents: write
  issues: write
concurrency:
  group: commandline-terminal
  cancel-in-progress: false
jobs:
  command:
    if: github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse issue comment into structured commands
        env:
          COMMAND_API_TOKEN: ${{ secrets.COMMAND_API_TOKEN || github.token }}
          COMMAND_ISSUE_NUMBER: ${{ vars.COMMAND_ISSUE_NUMBER }}
          COMMAND_PARSED_OUTPUT: ${{ runner.temp }}/parsed-commands.json
        run: node src/command-parser.js
      - name: Execute commands one at a time
        env:
          COMMAND_API_TOKEN: ${{ secrets.COMMAND_API_TOKEN || github.token }}
          COMMAND_PARSED_OUTPUT: ${{ runner.temp }}/parsed-commands.json
          COMMAND_RESULT_QUEUE: ${{ runner.temp }}/result-queue.json
          COMMAND_SINGLE_RESULT: ${{ runner.temp }}/single-result.json
        run: |
          if [ ! -f "$COMMAND_PARSED_OUTPUT" ]; then exit 0; fi
          node src/command-workflow.js
      - name: Render and publish queued results
        if: always()
        env:
          COMMAND_API_TOKEN: ${{ secrets.COMMAND_API_TOKEN || github.token }}
          COMMAND_RESULT_QUEUE: ${{ runner.temp }}/result-queue.json
          COMMAND_OUTPUT_FORMAT: ${{ vars.COMMAND_OUTPUT_FORMAT }}
          COMMAND_OUTPUT_DESTINATION: ${{ vars.COMMAND_OUTPUT_DESTINATION }}
          COMMAND_OUTPUT_ISSUE: ${{ vars.COMMAND_OUTPUT_ISSUE }}
          COMMAND_OUTPUT_PATH: ${{ runner.temp }}/command-output.txt
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if [ -f "$COMMAND_RESULT_QUEUE" ]; then
            node src/publish-results.js
          fi

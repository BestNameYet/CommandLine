name: Update repository manifest
on:
  push:
    branches: [main]
    paths-ignore:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-manifest-main
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate metadata and generate manifest
        run: node src/generate-manifest.js
      - name: Commit generated manifest
        run: |
          if git diff --quiet -- manifest.json && git ls-files --error-unmatch manifest.json >/dev/null 2>&1; then
            echo "Manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh repository manifest"
          git push

name: Issue 6 Standard GH Executor
on:
  workflow_call:

permissions: {}

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      ISSUE6_INPUT_COMMENT_ID: '6358997143'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute standard GitHub command or normalize a comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node runtime/issue6-gh-command.cjs
